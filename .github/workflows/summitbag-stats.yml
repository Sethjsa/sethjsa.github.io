name: Update Summit Bag stats

on:
  schedule:
    # Daily at 06:00 UTC. Cheap once caught up - only a handful of new
    # activities to check most days.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "Rescan entire Strava activity history"
        type: boolean
        default: false
      refresh_recent_days:
        description: "Reprocess activities from the last N days (backfills newly-added fields without a full rescan). Leave 0 to skip."
        type: number
        default: 0

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Fetch and parse Strava activities
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.full_backfill }}" = "true" ]; then
            python scripts/update_summitbag_stats.py --full
          elif [ "${{ github.event.inputs.refresh_recent_days }}" != "0" ] && [ -n "${{ github.event.inputs.refresh_recent_days }}" ]; then
            python scripts/update_summitbag_stats.py --refresh-recent-days "${{ github.event.inputs.refresh_recent_days }}"
          else
            python scripts/update_summitbag_stats.py
          fi

      - name: Commit updated stats
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- _data/summitbag_stats.yml _data/summitbag_activities.json; then
            echo "No changes to commit"
            exit 0
          fi
          cp _data/summitbag_stats.yml /tmp/summitbag_stats.yml
          cp _data/summitbag_activities.json /tmp/summitbag_activities.json
          # A long run (this one can take hours) can finish after other
          # commits have landed on master. A plain rebase can hit a real
          # content conflict on these generated files (not just
          # non-fast-forward) and abort, silently dropping this run's work -
          # so instead reset onto the latest tip each retry and reapply our
          # freshly-computed output verbatim ("ours" always wins for these
          # machine-generated files; there's nothing to merge line-by-line).
          for i in 1 2 3 4 5; do
            cp /tmp/summitbag_stats.yml _data/summitbag_stats.yml
            cp /tmp/summitbag_activities.json _data/summitbag_activities.json
            git add _data/summitbag_stats.yml _data/summitbag_activities.json
            git commit -m "Update Summit Bag stats"
            if git push; then
              exit 0
            fi
            echo "push rejected, resetting onto latest origin/master and reapplying ($i/5)"
            git fetch origin master
            git reset --hard origin/master
          done
          echo "::error::Failed to push updated stats after retries"
          exit 1