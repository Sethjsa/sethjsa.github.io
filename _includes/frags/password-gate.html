<div id="password-gate-overlay" style="display:none; position:fixed; inset:0; background:#fff; z-index:9999; align-items:center; justify-content:center; flex-direction:column; font-family:'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;">
  <p style="margin-bottom:8px;">This page is password protected.</p>
  <form id="password-gate-form" style="display:flex; gap:8px;">
    <input type="password" id="password-gate-input" autocomplete="off" style="padding:4px 8px;">
    <button type="submit" style="padding:4px 12px;">Enter</button>
  </form>
  <p id="password-gate-error" style="display:none; color:#b00; margin-top:8px; font-size:0.9em;">Incorrect password.</p>
</div>
<script>
(function () {
  var GATE_KEY = "site-gate-unlocked";
  var PASSWORD = "mountains";
  var overlay = document.getElementById("password-gate-overlay");
  var body = document.body;

  function unlock() {
    sessionStorage.setItem(GATE_KEY, "1");
    overlay.style.display = "none";
    body.style.visibility = "visible";
  }

  if (sessionStorage.getItem(GATE_KEY) === "1") {
    body.style.visibility = "visible";
  } else {
    body.style.visibility = "hidden";
    overlay.style.display = "flex";
    overlay.style.visibility = "visible";
  }

  document.getElementById("password-gate-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var val = document.getElementById("password-gate-input").value;
    if (val === PASSWORD) {
      unlock();
    } else {
      document.getElementById("password-gate-error").style.display = "block";
    }
  });
})();
</script>
